version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: airport-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airportsecuritypass123}
      POSTGRES_DB: ${POSTGRES_DB:-airport_surveillance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - airport-net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: airport-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - airport-net
    restart: always

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=0.5
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - airport-net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - airport-net

  milvus:
    image: milvusdb/milvus:v2.3.0
    container_name: airport-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./config/milvus/milvus.yaml:/milvus/configs/milvus.yaml
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    depends_on:
      - etcd
      - minio
    networks:
      - airport-net
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airport-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-airportsecuritypass123}@postgres:5432/${POSTGRES_DB:-airport_surveillance}
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - SECRET_KEY=${SECRET_KEY:-supersecretjwtkeyforairportsurveillancesystem}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - shared_assets:/app/assets
    depends_on:
      - postgres
      - redis
      - milvus
    networks:
      - airport-net
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airport-celery
    command: celery -A app.workers.celery_tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-airportsecuritypass123}@postgres:5432/${POSTGRES_DB:-airport_surveillance}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - shared_assets:/app/assets
    depends_on:
      - redis
      - postgres
    networks:
      - airport-net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airport-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - airport-net
    restart: always

  video_processor:
    build:
      context: ./processing
      dockerfile: Dockerfile.gpu
    container_name: airport-video-processor
    command: python3 -m pipeline.pipeline_manager
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-airportsecuritypass123}@postgres:5432/${POSTGRES_DB:-airport_surveillance}
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - USE_GPU=false
    volumes:
      - ./processing:/app
      - ./models:/app/models
      - shared_assets:/app/assets
    depends_on:
      - backend
      - redis
      - milvus
    networks:
      - airport-net
    restart: always

networks:
  airport-net:
    name: airport-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  shared_assets:
