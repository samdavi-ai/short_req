global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'airport-backend'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'video-processor'
    static_configs:
      - targets: ['video_processor:8000']
